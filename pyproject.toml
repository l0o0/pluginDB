[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugindb-sync"
version = "0.1.0"
description = "Sync Zotero plugin release metadata into local JSON and SQLite"
requires-python = ">=3.13"
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
